<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>实验5 · TodoList | 栈间笔记</title>
    <link rel="stylesheet" href="css/site.css" />
    <script src="vendor/vue.global.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/todos.js" defer></script>
  </head>
  <body id="top">
    <noscript>请启用JavaScript以运行Vue实验。</noscript>
    <div id="app" v-cloak>
      <header class="site-header">
        <div class="container header-row">
          <a class="brand" href="index.html"
            ><img
              src="assets/logo.svg"
              width="36"
              height="36"
              alt=""
            />栈间笔记</a
          >
          <nav class="nav" aria-label="主导航">
            <a href="index.html">博客</a><a href="directives.html">指令练习</a
            ><a href="todos.html">学习清单</a
            ><a href="../../实验6/代码/index.html">组件与路由 →</a>
          </nav>
        </div>
      </header>
      <main class="container register-wrap">
        <section class="panel">
          <p class="eyebrow">V-FOR / COMPUTED / EDIT</p>
          <h1>把下一步，写进清单。</h1>
          <p class="muted">
            按回车添加；勾选完成；编辑后失焦或回车保存，Esc取消。
          </p>
          <form class="task-form" @submit.prevent="add" id="todo-form">
            <label for="task-text" style="position: absolute; left: -10000px"
              >待办内容</label
            ><input
              id="task-text"
              v-model.trim="taskText"
              maxlength="120"
              placeholder="想要完成的下一件事"
              aria-describedby="todo-error"
            /><button type="submit">添加任务</button>
          </form>
          <p id="todo-error" class="hint error">{{error}}</p>
          <div class="filter-tabs">
            <button
              v-for="item in filters"
              :key="item.value"
              type="button"
              class="secondary"
              :aria-pressed="filter===item.value"
              @click="filter=item.value"
            >
              {{item.label}}
            </button>
          </div>
          <p v-if="!visibleTodos.length" class="notice" id="todo-empty">
            {{todos.length?'这个分类里暂无任务。':'清单是空的，添加第一件事吧。'}}
          </p>
          <ul class="task-list">
            <li v-for="todo in visibleTodos" :key="todo.id" class="task-item">
              <input
                type="checkbox"
                v-model="todo.done"
                :aria-label="'完成'+todo.text"
              /><input
                v-if="editingId===todo.id"
                class="task-edit"
                :ref="el=>{if(el) editInput=el}"
                v-model="editText"
                @blur="saveEdit(todo.id)"
                @keydown.enter.prevent="saveEdit(todo.id)"
                @keydown.esc.prevent="cancelEdit"
                aria-label="编辑任务"
                maxlength="120"
              /><span v-else class="task-text" :class="{done:todo.done}"
                >{{todo.text}}</span
              >
              <div class="task-actions">
                <button
                  v-if="editingId!==todo.id"
                  type="button"
                  class="secondary edit-task"
                  @click="startEdit(todo)"
                >
                  编辑</button
                ><button
                  type="button"
                  class="secondary delete-task"
                  @mousedown.prevent
                  @click="del(todo.id)"
                >
                  删除
                </button>
              </div>
            </li>
          </ul>
          <div class="todo-summary" v-if="todos.length>0">
            <span>总计 <strong id="todo-total">{{todos.length}}</strong></span
            ><span
              >未完成 <strong id="todo-active">{{activeCount}}</strong></span
            ><span>已完成 <strong id="todo-done">{{doneCount}}</strong></span>
          </div>
          <p id="todo-storage" class="storage-note">
            {{storageNote||'清单保存到当前浏览器。'}}
          </p>
        </section>
      </main>
      <footer class="site-footer">
        <div class="container footer-row">
          <p>栈间笔记 · Vue 学习实验</p>
          <a href="#top">返回顶部 ↑</a>
        </div>
      </footer>
    </div>
  </body>
</html>
