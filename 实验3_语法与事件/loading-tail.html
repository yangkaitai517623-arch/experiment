<body><main class="container" id="main-content" style="margin-top:2rem"><section class="panel"><h1>JS 代码位置与加载顺序</h1><p id="placement-desc" class="muted">脚本位于元素之后，读取时按钮已经存在。</p><div class="actions"><button type="button" id="demo-button">点击输出信息</button><a href="index.html">返回实验3</a></div><pre id="placement-log" class="code-log"></pre></section></main><footer class="site-footer"><div class="container footer-row"><p>栈间笔记 · Web 全栈开发技术实验</p><a href="#top">回到顶部 ↑</a></div></footer><script>
const button = document.getElementById('demo-button');
const log = document.getElementById('placement-log');
log.textContent = 'body 尾部：已经找到按钮，无需等待 window.onload。';
button.addEventListener('click', () => { console.log('body尾部按钮触发'); log.textContent += '\n点击事件触发：body 尾部脚本。'; });
</script></body></html>
