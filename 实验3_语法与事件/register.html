<body><a class="skip-link" href="#main-content">跳到主要内容</a><header class="site-header" id="top"><div class="container header-row"><a class="brand" href="index.html"><img src="assets/logo.svg" width="36" height="36" alt="">栈间笔记</a><nav class="nav" aria-label="主导航"><a href="index.html">首页</a><a href="register.html">注册验证</a><a href="js-basics-es6.html">语法练习</a><div class="theme-picker"><button id="theme-toggle" type="button" aria-expanded="false" aria-pressed="false" aria-controls="theme-menu">更换皮肤 · 日间</button><div class="theme-menu" id="theme-menu" hidden><button type="button" data-theme="day" aria-pressed="true">日间</button><button type="button" data-theme="night" aria-pressed="false">夜间</button><button type="button" data-theme="forest" aria-pressed="false">森林</button></div></div></nav></div></header><main class="register-wrap" id="main-content"><section class="panel"><div class="register-intro"><p class="eyebrow">FOCUS / BLUR / SUBMIT</p><h1>创建你的博客账号</h1><p class="muted">完成五项输入，体验逐项校验和提交反馈。</p></div><form id="register-form" novalidate><div class="field"><label for="username">用户名</label><input id="username" name="username" type="text" autocomplete="username" placeholder="4—12 位字母、数字或下划线" aria-describedby="username-hint" required><p id="username-hint" class="hint"></p></div><div class="field"><label for="email">邮箱</label><input id="email" name="email" type="email" autocomplete="email" placeholder="例如 student@example.com" aria-describedby="email-hint" required><p id="email-hint" class="hint"></p></div><div class="field"><label for="phone">手机号码</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="以 1 开头的 11 位数字" aria-describedby="phone-hint" required><p id="phone-hint" class="hint"></p></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="8—20 位，至少包含字母和数字，无空格" aria-describedby="password-hint" required><p id="password-hint" class="hint"></p></div><div class="field"><label for="confirm">确认密码</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="请再次输入相同的密码" aria-describedby="confirm-hint" required><p id="confirm-hint" class="hint"></p></div><div class="actions"><button type="submit">提交注册</button><button type="reset" class="secondary">重新填写</button><a href="index.html">返回首页</a></div><p class="storage-note">前端校验练习：提交后仅显示结果，不创建真实账号，不保存密码。</p><div id="register-status" class="notice" role="status" aria-live="polite" hidden></div></form></section></main><footer class="site-footer"><div class="container footer-row"><p>栈间笔记 · Web 全栈开发技术实验</p><a href="#top">回到顶部 ↑</a></div></footer></body></html>
